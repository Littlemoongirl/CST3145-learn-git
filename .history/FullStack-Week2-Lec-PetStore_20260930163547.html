<!DOCTYPE html>
<html lang="en">
    <head>
       <title>Vue.js Pet Depot</title>
        <!-- Load Vue.js from a server (so no local file is needed) -->
        <script src="https://unpkg.com/vue@2.7.8/dist/vue.js"></script>
        <!-- Load Font Awesome for icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
    </head>
    <body>
        <!-- The element where Vue will mount -->
         <div id="app">
         <header>
            <h1 v-text="sitename"></h1>
            <button>
                <!-- 'cartItemCount' is used the same way as a data property. -->
                 {{ cartItemCount }}
                 <!-- add the cart icon -->
                  <span class="fas fa-cart-plus"></span> Checkout
                </button>
        </header>
        <main>
           
            <figure>
                <!-- bind 'src' attr to 'product.image' in 'data' -->
                 <img v-bind:src="product.image">
                </figure>
                <h2 v-text="product.title"></h2>
                <p v-html="product.description"></p>
                <!-- The double curly brackets is used instead of 'v-text' -->
                 <p>Price: {{product.price}}</p>
                 <p>Available Stock: {{ product.availableInventory }}</p>
                 <button v-on:click="addToCart" v-if="canAddToCart">
                    Add to cart
                </button>
                
                <!-- This button will be displayed otherwise -->
                 <button disabled='disabled' v-else>
                    Add to cart
                </button>
                </div>
                
            </main>
            </div>
         <script type="text/javascript">
                 let webstore = new Vue({ // The Vue instance
                         el: '#app', // <=== Don't forget this comma // The 'option object': DOM mounting point
                         data: { // the 'data' option
                         // the key 'sitename' matches the value of 'v-text' earlier
                         sitename: 'Vue.js Pet Depot',
                         product: {
                            id: 1001,
                            title: "Cat Food, 25lb bag",
                            description: "A 25 pound bag of <em>irresistible</em>," + "organic goodness for your cat.",
                            price: 2000,
                            image: "images/product-fullsize.png.avif",
                            availableInventory: 5,
                          
                            
                         },
                         cart:[] ,
                           showProduct: true,// array to store items in shopping cart
                        },
                        methods: {
                            addToCart: function () {
                                this.cart.push(this.product.id);
                            },
                            showCheckout() {
                                this.showProduct = this.showProduct ? false : true;
                            },
                            
                        },
                        computed: { // the Computed Property object
                                cartItemCount(){ // the property name
                                    // its value is calculated when it is called
                                    return this.cart.length 
                                },
                                canAddToCart: function() {
                                    return this.product.availableInventory > this.cartItemCount;
                                }
                            }

                 });

         </script>
    </body>
</html>
